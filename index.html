<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆掌—教练端</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="prototype-stage">
      <aside class="review-panel" aria-label="原型页面清单">
        <strong>馆掌—教练端</strong>
        <span>V1.0 · 移动端交互原型</span>
        <div id="pageIndex" class="page-index"></div>
      </aside>

      <main class="phone-shell" aria-label="小程序手机预览">
        <div class="phone-status">
          <span>9:41</span>
          <span>5G  ▰</span>
        </div>

        <section class="miniapp">
          <header class="app-header">
            <button id="backBtn" class="ghost-icon" type="button" aria-label="返回">‹</button>
            <div>
              <h1 id="pageTitle">训练</h1>
              <p id="pageSubtitle">课程日历、今日课程和课程详情处理</p>
            </div>
            <button id="headerAction" class="header-action" type="button"></button>
          </header>

          <div id="appView" class="app-view"></div>

          <nav class="tabbar" aria-label="底部导航">
            <button class="tab" data-route="fields" type="button">
              <span>场</span>
              场地
            </button>
            <button class="tab" data-route="students" type="button">
              <span>员</span>
              学员
            </button>
            <button class="tab active" data-route="training" type="button">
              <span>训</span>
              训练
            </button>
            <button class="tab" data-route="mine" type="button">
              <span>我</span>
              我的
            </button>
          </nav>
        </section>
      </main>
    </div>

    <div id="dialogMask" class="modal-mask" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          <h2 id="dialogTitle">确认操作</h2>
          <button class="ghost-icon sheet-close" data-close-dialog type="button" aria-label="关闭">×</button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
        <div id="dialogActions" class="sheet-actions"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
